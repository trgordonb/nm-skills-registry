[project]
name = "nm-skills-registry"
version = "0.1.5"
description = "S3-backed agent skills registry with per-user enable/disable (Hermes-style toggles)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "obstore>=0.6",
    "pyyaml>=6.0",
]

[project.scripts]
nm-skills = "nm_skills_registry.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nm_skills_registry"]
